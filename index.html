<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BestiePop ✨ | How Well Do You Know Me?</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              pink: '#FF6B8B',
              coral: '#FF8E53',
              purple: '#8B5CF6',
              yellow: '#FBBF24',
              mint: '#10B981',
              bg: '#FFF5F7'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Font: Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React 18 & Babel (Direct in-browser execution) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Firebase App & Firestore (Modular via Compat for easy CDN access) -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background: linear-gradient(135deg, #FFE5EC 0%, #FFF0F5 50%, #E8EAFF 100%);
      min-height: 100vh;
      margin: 0;
      color: #2D3748;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .animate-float {
      animation: float 3.5s ease-in-out infinite;
    }
    .tap-bounce:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- PUFFO MASCOT COMPONENT ---
    const PuffoMascot = ({ mood = 'happy', size = 110 }) => {
      return (
        <div className="relative inline-block animate-float select-none">
          <svg width={size} height={size} viewBox="0 0 160 160" className="drop-shadow-lg">
            <defs>
              <linearGradient id="puffoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#FFAEC0" />
                <stop offset="100%" stopColor="#FF7096" />
              </linearGradient>
            </defs>
            {/* Body */}
            <path
              d="M 80 18 C 122 18, 145 48, 145 92 C 145 130, 115 146, 80 146 C 45 146, 15 130, 15 92 C 15 48, 38 18, 80 18 Z"
              fill="url(#puffoGrad)"
            />
            {/* Cheeks */}
            <ellipse cx="42" cy="98" rx="9" ry="6" fill="#FF477E" opacity="0.35" />
            <ellipse cx="118" cy="98" rx="9" ry="6" fill="#FF477E" opacity="0.35" />

            {/* Expressions */}
            {mood === 'celebrate' && (
              <g>
                <path d="M 45 78 Q 55 68 65 78" stroke="#333" strokeWidth="4" strokeLinecap="round" fill="none" />
                <path d="M 95 78 Q 105 68 115 78" stroke="#333" strokeWidth="4" strokeLinecap="round" fill="none" />
                <path d="M 68 96 Q 80 116 92 96 Z" fill="#333" />
                {/* Party Hat */}
                <polygon points="80,5 64,30 96,30" fill="#FBBF24" />
                <circle cx="80" cy="4" r="5" fill="#10B981" />
              </g>
            )}

            {mood === 'thinking' && (
              <g>
                <circle cx="55" cy="76" r="7" fill="#333" />
                <circle cx="105" cy="74" r="9" fill="#333" />
                <ellipse cx="80" cy="98" rx="5" ry="7" fill="#333" />
                <text x="120" y="55" fontSize="24" fontWeight="bold" fill="#8B5CF6">?</text>
              </g>
            )}

            {mood === 'shocked' && (
              <g>
                <circle cx="55" cy="75" r="9" fill="#333" />
                <circle cx="105" cy="75" r="9" fill="#333" />
                <circle cx="57" cy="73" r="3" fill="#FFF" />
                <circle cx="107" cy="73" r="3" fill="#FFF" />
                <ellipse cx="80" cy="104" rx="10" ry="14" fill="#333" />
                {/* Sweat drop */}
                <path d="M 125 65 C 122 55, 130 55, 127 65 Z" fill="#38BDF8" />
              </g>
            )}

            {(mood === 'happy' || mood === 'excited') && (
              <g>
                <ellipse cx="55" cy="78" rx="7" ry="9" fill="#333" />
                <ellipse cx="105" cy="78" rx="7" ry="9" fill="#333" />
                <circle cx="57" cy="75" r="3" fill="#FFF" />
                <circle cx="107" cy="75" r="3" fill="#FFF" />
                <path d="M 68 95 Q 80 112 92 95 Z" fill="#333" />
                <path d="M 72 100 Q 80 108 88 100" fill="#FF85A1" />
              </g>
            )}
          </svg>
        </div>
      );
    };

    // Default Questions Pool
    const DEFAULT_QUESTIONS = [
      {
        question: "What is my absolute favourite food? 🍕",
        options: ["Cheesy Pizza", "Spicy Biryani", "Crispy Burger", "Sweet Desserts"],
        correct: 0
      },
      {
        question: "What do I do late at 2 AM? 🌙",
        options: ["Deep sleeping", "Endless Reels scroll", "Overthinking life", "Eating secret snacks"],
        correct: 1
      },
      {
        question: "What annoys me the most? 😤",
        options: ["Slow Internet", "Late replies", "Fake people", "Cancelled plans"],
        correct: 0
      },
      {
        question: "My dream vacation would be... ✈️",
        options: ["Peaceful Mountains", "Tropical Beach", "Busy City Lights", "Staying in Bed"],
        correct: 1
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [route, setRoute] = useState(window.location.hash || '#/');
      const [creatorName, setCreatorName] = useState('');
      const [questions, setQuestions] = useState(DEFAULT_QUESTIONS);
      const [activeQIdx, setActiveQIdx] = useState(0);
      const [currentQuizId, setCurrentQuizId] = useState('');
      const [dbStatus, setDbStatus] = useState('Local Storage');

      // Friend playing states
      const [friendName, setFriendName] = useState('');
      const [friendAnswers, setFriendAnswers] = useState([]);
      const [quizData, setQuizData] = useState(null);
      const [score, setScore] = useState(null);
      const [leaderboard, setLeaderboard] = useState([]);

      // Hash routing listener
      useEffect(() => {
        const handleHash = () => {
          const hash = window.location.hash || '#/';
          setRoute(hash);

          if (hash.startsWith('#/quiz/')) {
            const id = hash.replace('#/quiz/', '');
            loadQuiz(id);
          } else if (hash.startsWith('#/results/')) {
            const id = hash.replace('#/results/', '');
            loadLeaderboard(id);
          }
        };
        window.addEventListener('hashchange', handleHash);
        handleHash();
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      // Save Quiz
      const handlePublishQuiz = () => {
        if (!creatorName.trim()) {
          alert("Please enter your name first!");
          return;
        }
        const id = 'quiz_' + Math.random().toString(36).substring(2, 8);
        const payload = {
          id,
          creatorName,
          questions,
          createdAt: new Date().toISOString(),
          attempts: []
        };

        // Save local
        localStorage.setItem(`bestiepop_${id}`, JSON.stringify(payload));
        setCurrentQuizId(id);
        if (window.confetti) {
          window.confetti({ particleCount: 70, spread: 60 });
        }
        window.location.hash = `#/share/${id}`;
      };

      // Load Quiz for Friend
      const loadQuiz = (id) => {
        const saved = localStorage.getItem(`bestiepop_${id}`);
        if (saved) {
          const parsed = JSON.parse(saved);
          setQuizData(parsed);
          setFriendAnswers(new Array(parsed.questions.length).fill(null));
        } else {
          setQuizData(null);
        }
      };

      // Load Leaderboard for Creator
      const loadLeaderboard = (id) => {
        const saved = localStorage.getItem(`bestiepop_${id}`);
        if (saved) {
          const parsed = JSON.parse(saved);
          setLeaderboard(parsed.attempts || []);
        }
      };

      // Friend submit answers
      const handleFriendSubmit = () => {
        if (!friendName.trim()) {
          alert("Please enter your name!");
          return;
        }
        let correctCount = 0;
        quizData.questions.forEach((q, idx) => {
          if (friendAnswers[idx] === q.correct) {
            correctCount++;
          }
        });
        const calculatedScore = {
          name: friendName,
          score: correctCount,
          total: quizData.questions.length,
          percent: Math.round((correctCount / quizData.questions.length) * 100),
          date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        // Update local quiz
        const updated = { ...quizData };
        updated.attempts = [calculatedScore, ...(updated.attempts || [])];
        localStorage.setItem(`bestiepop_${quizData.id}`, JSON.stringify(updated));

        setScore(calculatedScore);
        if (window.confetti) {
          window.confetti({ particleCount: 80, spread: 70 });
        }
        setRoute('#/friend-score');
      };

      const shareUrl = `${window.location.origin}${window.location.pathname}#/quiz/${currentQuizId || ''}`;

      // --- PAGE 1: HOME ---
      if (route === '#/' || route === '') {
        return (
          <div className="max-w-md mx-auto px-5 py-8 flex flex-col items-center min-h-screen justify-between">
            <div className="text-center pt-6">
              <span className="bg-pink-100 text-pink-600 text-xs px-3.5 py-1.5 rounded-full font-bold uppercase tracking-wider">
                Friendship Test 2026 ✨
              </span>
              <h1 className="text-4xl font-extrabold text-gray-900 mt-4 leading-tight">
                Think You <br />
                <span className="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-rose-400">
                  Know Me? 👀
                </span>
              </h1>
              <p className="text-gray-500 text-sm mt-3 px-4">
                Make your personal quiz, send it on WhatsApp, and find out who your real Bestie is!
              </p>
            </div>

            <div className="my-6">
              <PuffoMascot mood="excited" size={130} />
            </div>

            <div className="w-full space-y-3 pb-8">
              <button
                onClick={() => setRoute('#/create')}
                className="w-full py-4 bg-gradient-to-r from-pink-500 to-rose-400 text-white font-bold rounded-2xl shadow-lg shadow-pink-200 text-lg tap-bounce"
              >
                Create My Quiz ✨
              </button>
            </div>
          </div>
        );
      }

      // --- PAGE 2: CREATE QUIZ ---
      if (route === '#/create') {
        const curQ = questions[activeQIdx];

        return (
          <div className="max-w-md mx-auto px-5 py-6 min-h-screen flex flex-col justify-between">
            <div>
              <div className="flex items-center justify-between">
                <button onClick={() => setRoute('#/')} className="text-gray-400 text-sm font-bold">✕ Close</button>
                <span className="text-xs bg-pink-100 text-pink-600 font-bold px-3 py-1 rounded-full">
                  Question {activeQIdx + 1} / {questions.length}
                </span>
              </div>

              {/* Creator Name input */}
              {activeQIdx === 0 && (
                <div className="mt-4 bg-white p-4 rounded-2xl shadow-sm border border-pink-100">
                  <label className="text-xs font-bold text-gray-400 uppercase">Your Nickname</label>
                  <input
                    type="text"
                    value={creatorName}
                    onChange={(e) => setCreatorName(e.target.value)}
                    placeholder="e.g. Aman, Priya"
                    className="w-full mt-1 font-bold text-lg text-gray-800 outline-none"
                  />
                </div>
              )}

              {/* Mascot header */}
              <div className="text-center my-4">
                <PuffoMascot mood="thinking" size={90} />
                <h2 className="text-xl font-bold text-gray-800 mt-2">
                  {curQ.question}
                </h2>
                <p className="text-xs text-pink-500 font-medium">👉 Tap the correct answer about you!</p>
              </div>

              {/* Answer Choices */}
              <div className="space-y-2.5 mt-4">
                {curQ.options.map((opt, oIdx) => {
                  const isCorrect = curQ.correct === oIdx;
                  return (
                    <button
                      key={oIdx}
                      onClick={() => {
                        const updated = [...questions];
                        updated[activeQIdx].correct = oIdx;
                        setQuestions(updated);
                      }}
                      className={`w-full p-4 rounded-2xl font-bold text-left flex items-center justify-between border-2 transition-all tap-bounce ${
                        isCorrect
                          ? 'border-pink-500 bg-pink-50 text-pink-700 shadow-sm'
                          : 'border-white bg-white text-gray-700 shadow-sm'
                      }`}
                    >
                      <span>{opt}</span>
                      {isCorrect && <span className="text-pink-500 text-lg">✓</span>}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Bottom Controls */}
            <div className="pt-6 pb-4 space-y-2">
              <div className="flex gap-2">
                {activeQIdx > 0 && (
                  <button
                    onClick={() => setActiveQIdx(activeQIdx - 1)}
                    className="flex-1 py-3.5 bg-gray-100 text-gray-600 font-bold rounded-xl tap-bounce"
                  >
                    ← Prev
                  </button>
                )}
                {activeQIdx < questions.length - 1 ? (
                  <button
                    onClick={() => setActiveQIdx(activeQIdx + 1)}
                    className="flex-1 py-3.5 bg-pink-500 text-white font-bold rounded-xl shadow-md tap-bounce"
                  >
                    Next Question →
                  </button>
                ) : (
                  <button
                    onClick={handlePublishQuiz}
                    className="flex-1 py-3.5 bg-gradient-to-r from-emerald-400 to-teal-500 text-white font-bold rounded-xl shadow-md tap-bounce"
                  >
                    Publish Quiz 🎉
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      }

      // --- PAGE 3: SHARE QUIZ ---
      if (route.startsWith('#/share/')) {
        return (
          <div className="max-w-md mx-auto px-5 py-8 flex flex-col items-center justify-between min-h-screen text-center">
            <div className="pt-4">
              <PuffoMascot mood="celebrate" size={130} />
              <h2 className="text-3xl font-extrabold text-gray-900 mt-4">Quiz is Ready! 🎉</h2>
              <p className="text-gray-500 text-sm mt-2">
                Send this link to your friends on WhatsApp to see who knows you best!
              </p>
            </div>

            <div className="w-full bg-white p-4 rounded-2xl shadow-sm border border-pink-100 my-4">
              <span className="text-xs font-bold text-gray-400 block mb-1">Your Shareable Link</span>
              <div className="text-xs bg-gray-50 p-2.5 rounded-lg text-gray-600 break-all select-all font-mono">
                {shareUrl}
              </div>
            </div>

            <div className="w-full space-y-3 pb-6">
              <button
                onClick={() => {
                  const text = `Let's see how well you REALLY know me 😏 Take my quiz here: ${shareUrl}`;
                  window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
                }}
                className="w-full py-4 bg-emerald-500 text-white font-bold rounded-2xl shadow-lg shadow-emerald-100 flex items-center justify-center gap-2 tap-bounce"
              >
                <span>💬</span> Share on WhatsApp
              </button>

              <button
                onClick={() => {
                  navigator.clipboard.writeText(shareUrl);
                  alert("Link copied! Paste it in your Instagram Story or chat.");
                }}
                className="w-full py-3.5 bg-pink-100 text-pink-600 font-bold rounded-2xl tap-bounce"
              >
                Copy Link 📋
              </button>

              <button
                onClick={() => setRoute(`#/results/${currentQuizId}`)}
                className="w-full py-2.5 text-gray-400 font-bold text-sm"
              >
                View Live Leaderboard 🏆
              </button>
            </div>
          </div>
        );
      }

      // --- PAGE 4: FRIEND QUIZ SOLVER ---
      if (route.startsWith('#/quiz/')) {
        if (!quizData) {
          return (
            <div className="text-center py-20">
              <PuffoMascot mood="shocked" size={100} />
              <p className="text-gray-500 mt-4">Quiz not found or loaded!</p>
              <button onClick={() => setRoute('#/')} className="mt-4 text-pink-500 font-bold">Go Home</button>
            </div>
          );
        }

        const curQ = quizData.questions[activeQIdx];

        return (
          <div className="max-w-md mx-auto px-5 py-6 min-h-screen flex flex-col justify-between">
            <div>
              <div className="flex items-center justify-between text-xs text-pink-600 font-bold bg-pink-50 px-3 py-1.5 rounded-full mb-3">
                <span>Testing for: {quizData.creatorName}</span>
                <span>{activeQIdx + 1} / {quizData.questions.length}</span>
              </div>

              {activeQIdx === 0 && (
                <div className="mb-4 bg-white p-3.5 rounded-2xl border border-pink-100">
                  <label className="text-xs font-bold text-gray-400">ENTER YOUR NAME</label>
                  <input
                    type="text"
                    value={friendName}
                    onChange={(e) => setFriendName(e.target.value)}
                    placeholder="Your name"
                    className="w-full mt-1 font-bold text-gray-800 outline-none"
                  />
                </div>
              )}

              <div className="text-center my-4">
                <PuffoMascot mood="happy" size={85} />
                <h3 className="text-xl font-bold text-gray-800 mt-3">{curQ.question}</h3>
              </div>

              <div className="space-y-2.5 mt-4">
                {curQ.options.map((opt, optIdx) => {
                  const isSelected = friendAnswers[activeQIdx] === optIdx;
                  return (
                    <button
                      key={optIdx}
                      onClick={() => {
                        const updated = [...friendAnswers];
                        updated[activeQIdx] = optIdx;
                        setFriendAnswers(updated);
                      }}
                      className={`w-full p-4 rounded-2xl font-bold text-left border-2 transition-all tap-bounce ${
                        isSelected
                          ? 'border-pink-500 bg-pink-50 text-pink-600'
                          : 'border-white bg-white text-gray-700'
                      }`}
                    >
                      {opt}
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="pt-6 pb-4">
              {activeQIdx < quizData.questions.length - 1 ? (
                <button
                  disabled={friendAnswers[activeQIdx] === null}
                  onClick={() => setActiveQIdx(activeQIdx + 1)}
                  className="w-full py-4 bg-pink-500 disabled:opacity-40 text-white font-bold rounded-2xl shadow-md tap-bounce"
                >
                  Next →
                </button>
              ) : (
                <button
                  disabled={friendAnswers[activeQIdx] === null}
                  onClick={handleFriendSubmit}
                  className="w-full py-4 bg-gradient-to-r from-pink-500 to-rose-400 disabled:opacity-40 text-white font-bold rounded-2xl shadow-lg tap-bounce"
                >
                  Submit & See Score 🎯
                </button>
              )}
            </div>
          </div>
        );
      }

      // --- PAGE 5: FRIEND RESULT ---
      if (route === '#/friend-score' && score) {
        const isSuper = score.percent >= 70;
        return (
          <div className="max-w-md mx-auto px-5 py-8 flex flex-col items-center justify-between min-h-screen text-center">
            <div className="pt-4">
              <PuffoMascot mood={isSuper ? 'celebrate' : 'shocked'} size={120} />
              <h2 className="text-3xl font-extrabold text-gray-900 mt-4">
                {isSuper ? "Soulmate Status! 🔥" : "Bro, do you even know me? 😂"}
              </h2>
              <p className="text-gray-500 text-sm mt-1">You scored for {quizData?.creatorName}</p>

              <div className="my-6 inline-block bg-white px-8 py-5 rounded-3xl shadow-sm border border-pink-100">
                <span className="text-5xl font-black text-pink-500">{score.score} / {score.total}</span>
                <span className="block text-xs font-bold text-gray-400 mt-1">{score.percent}% Accuracy</span>
              </div>
            </div>

            <div className="w-full space-y-3 pb-6">
              <button
                onClick={() => {
                  window.location.hash = '#/';
                  window.location.reload();
                }}
                className="w-full py-4 bg-gradient-to-r from-pink-500 to-rose-400 text-white font-bold rounded-2xl shadow-md tap-bounce"
              >
                Create Your Own Quiz ✨
              </button>
            </div>
          </div>
        );
      }

      // --- PAGE 6: CREATOR LEADERBOARD ---
      if (route.startsWith('#/results/')) {
        return (
          <div className="max-w-md mx-auto px-5 py-6 min-h-screen">
            <div className="flex items-center justify-between mb-4">
              <button onClick={() => setRoute('#/')} className="text-gray-400 text-sm font-bold">← Home</button>
              <h2 className="font-extrabold text-gray-800">Who Knows Me Best? 👀</h2>
              <div className="w-8"></div>
            </div>

            <div className="space-y-2 mt-4">
              {leaderboard.length === 0 ? (
                <div className="text-center py-16 bg-white rounded-3xl border border-pink-50 p-6">
                  <PuffoMascot mood="thinking" size={90} />
                  <p className="text-gray-500 text-sm mt-3 font-medium">No one has taken your quiz yet!</p>
                  <p className="text-xs text-gray-400 mt-1">Share the link on WhatsApp to get scores.</p>
                </div>
              ) : (
                leaderboard.map((item, idx) => (
                  <div key={idx} className="bg-white p-4 rounded-2xl shadow-sm border border-pink-50 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 rounded-full bg-pink-100 flex items-center justify-center font-black text-pink-600">
                        {idx + 1}
                      </div>
                      <div>
                        <h4 className="font-bold text-gray-800">{item.name}</h4>
                        <span className="text-xs text-gray-400">{item.date}</span>
                      </div>
                    </div>
                    <div className="text-right">
                      <span className="font-black text-pink-500 text-lg">{item.score}/{item.total}</span>
                      <span className="text-xs text-gray-400 block">{item.percent}%</span>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
